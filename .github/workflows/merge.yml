name: 重铸酷9并推送到目标仓库

on:
  workflow_dispatch:
    inputs:
      ku9_repo:
        description: '酷9仓库 (如 9602894/080java)'
        required: false
        default: '9602894/080java'
      ku9_branch:
        description: '酷9分支'
        required: false
        default: 'main'
      tvbox_repo:
        description: 'TVBoxOS仓库 (如 tytestelle/TVBoxOS)'
        required: false
        default: 'tytestelle/TVBoxOS'
      tvbox_branch:
        description: 'TVBoxOS分支'
        required: false
        default: 'main'
      target_owner:
        description: '目标仓库所有者 (用户名或组织，建议填写你的用户名)'
        required: false
        default: ''
      target_repo:
        description: '目标仓库名称 (若不存在且提供了有效PAT，会自动创建)'
        required: true
        default: 'ku9-recast'
      personal_access_token:
        description: '个人访问令牌 (需有repo和admin:repo_hook权限，留空则使用GITHUB_TOKEN但无法创建新仓库)'
        required: false
      branch:
        description: '目标分支 (默认 main)'
        required: false
        default: 'main'
      repo_visibility:
        description: '新仓库可见性 (仅当创建新仓库时生效)'
        required: false
        default: 'private'
        type: choice
        options:
          - private
          - public

jobs:
  recast_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出工作流脚本
        uses: actions/checkout@v4
        with:
          path: workflow

      - name: 检出酷9
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.ku9_repo }}
          ref: ${{ github.event.inputs.ku9_branch }}
          path: ku9

      - name: 检出TVBoxOS
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.tvbox_repo }}
          ref: ${{ github.event.inputs.tvbox_branch }}
          path: tvbox

      - name: 执行重铸脚本
        run: |
          chmod +x workflow/recast.sh
          workflow/recast.sh ./ku9 ./tvbox ./output 2>&1 | tee recast.log

      - name: 设置Git用户信息
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 准备推送
        env:
          GH_TOKEN: ${{ github.event.inputs.personal_access_token || secrets.GITHUB_TOKEN }}
          TARGET_OWNER: ${{ github.event.inputs.target_owner || github.repository_owner }}
          TARGET_REPO: ${{ github.event.inputs.target_repo }}
          BRANCH: ${{ github.event.inputs.branch }}
          VISIBILITY: ${{ github.event.inputs.repo_visibility }}
        run: |
          # 如果提供了 PAT，则尝试创建仓库（若不存在）
          if [ -n "${{ github.event.inputs.personal_access_token }}" ]; then
            echo "使用个人访问令牌，尝试创建仓库..."
            # 先检查仓库是否存在
            if gh repo view "${TARGET_OWNER}/${TARGET_REPO}" >/dev/null 2>&1; then
              echo "仓库已存在，跳过创建"
            else
              echo "仓库不存在，正在创建..."
              # 创建仓库（不使用 --clone --push --remote）
              if ! gh repo create "${TARGET_REPO}" --"${VISIBILITY}" ; then
                echo "❌ 创建仓库失败！请检查："
                echo "  1. PAT 是否具有 'repo' 和 'admin:repo_hook' 权限"
                echo "  2. 目标所有者 '${TARGET_OWNER}' 是否正确，以及你是否拥有在该名下创建仓库的权限"
                echo "  3. 仓库名称 '${TARGET_REPO}' 是否已被占用且不属于你"
                exit 1
              fi
              # 再次验证创建是否成功
              if ! gh repo view "${TARGET_OWNER}/${TARGET_REPO}" >/dev/null 2>&1; then
                echo "❌ 创建后仍无法访问仓库，可能权限不足"
                exit 1
              fi
              echo "✅ 仓库创建成功"
            fi
          else
            echo "使用 GITHUB_TOKEN，跳过仓库创建（要求仓库已存在）"
          fi

          # 克隆目标仓库
          echo "正在克隆目标仓库..."
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_OWNER}/${TARGET_REPO}.git" target_repo || {
            echo "❌ 克隆失败，请确认："
            echo "  1. 仓库 ${TARGET_OWNER}/${TARGET_REPO} 是否存在"
            echo "  2. 提供的令牌是否有权限访问该仓库"
            echo "  3. 如果仓库是私有的，是否添加了正确权限"
            exit 1
          }

          cd target_repo

          # 清空旧内容（保留 .git）
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} \;

          # 将 output 内容复制到仓库根目录
          cp -r ../output/. .

          # 添加 README（若不存在）
          if [ ! -f README.md ]; then
            cat > README.md << 'EOF'
          # 酷9 重铸版 (TVBoxOS骨架 + 酷9UI)

          本仓库由 GitHub Actions 自动生成。
          - Java 业务逻辑采用 TVBoxOS 标准实现
          - UI 资源 (res/assets) 保留酷9风格
          - 酷9混淆代码备份于 `ku9_obfuscated_java/`

          ## 编译
          ./gradlew :app:assembleJavaDebug
          EOF
          fi

          # 提交并推送
          git add -A
          git commit -m "重铸酷9: $(date +'%Y-%m-%d %H:%M')" || echo "没有新变更"
          git push -u origin "$BRANCH" --force

      - name: 上传日志（备查）
        uses: actions/upload-artifact@v4
        with:
          name: recast-logs
          path: |
            recast.log
            ./output/MERGE_REPORT.md 2>/dev/null || true
          retention-days: 7
✅ 配套脚本 recast.sh（不变）
