name: 重铸酷9并推送至本仓库

on:
  workflow_dispatch:
    inputs:
      ku9_repo:
        description: '酷9仓库 (如 9602894/080java)'
        required: false
        default: '9602894/080java'
      ku9_branch:
        description: '酷9分支'
        required: false
        default: 'main'
      tvbox_repo:
        description: 'TVBoxOS仓库 (如 tytestelle/TVBoxOS)'
        required: false
        default: 'tytestelle/TVBoxOS'
      tvbox_branch:
        description: 'TVBoxOS分支'
        required: false
        default: 'main'
      target_branch:
        description: '推送目标分支 (默认 recast，若分支不存在将自动创建)'
        required: false
        default: 'recast'

jobs:
  recast_and_push:
    runs-on: ubuntu-latest
    steps:
      # 检出当前仓库（工作流运行所在的仓库）
      - name: 检出当前仓库
        uses: actions/checkout@v4
        with:
          path: current_repo

      # 检出酷9 和 TVBoxOS 到其他路径
      - name: 检出酷9
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.ku9_repo }}
          ref: ${{ github.event.inputs.ku9_branch }}
          path: ku9

      - name: 检出TVBoxOS
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.tvbox_repo }}
          ref: ${{ github.event.inputs.tvbox_branch }}
          path: tvbox

      # 重铸脚本（注意路径：当前工作目录为 $GITHUB_WORKSPACE）
      - name: 执行重铸脚本
        run: |
          # 将脚本复制到工作目录并执行
          cp current_repo/workflow/recast.sh .
          chmod +x recast.sh
          ./recast.sh ./ku9 ./tvbox ./output 2>&1 | tee recast.log

      - name: 设置Git用户信息
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 推送重铸代码到目标分支
        env:
          BRANCH: ${{ github.event.inputs.target_branch }}
        run: |
          cd current_repo
          # 切换到目标分支（若不存在则创建）
          if git show-ref --verify --quiet refs/heads/${BRANCH}; then
            git checkout ${BRANCH}
          else
            git checkout -b ${BRANCH}
          fi

          # 清空除 .git 外的所有内容（保留 .git）
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} \;

          # 将 ../output/ 的内容复制到当前目录
          cp -r ../output/. .

          # 添加 README（若没有）
          if [ ! -f README.md ]; then
            cat > README.md << 'EOF'
          # 酷9 重铸版 (TVBoxOS骨架 + 酷9UI)

          本仓库由 GitHub Actions 自动生成。
          - Java 业务逻辑采用 TVBoxOS 标准实现
          - UI 资源 (res/assets) 保留酷9风格
          - 酷9混淆代码备份于 `ku9_obfuscated_java/`

          ## 编译
          ./gradlew :app:assembleJavaDebug
          EOF
          fi

          # 添加所有文件并提交
          git add -A
          git commit -m "重铸酷9: $(date +'%Y-%m-%d %H:%M')" || echo "没有新变更"
          # 强制推送到远程分支
          git push -f origin ${BRANCH}

      - name: 上传日志（备查）
        uses: actions/upload-artifact@v4
        with:
          name: recast-logs
          path: |
            recast.log
            ./output/MERGE_REPORT.md 2>/dev/null || true
          retention-days: 7
