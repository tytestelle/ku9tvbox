name: 重铸酷9并推送到目标仓库

on:
  workflow_dispatch:
    inputs:
      ku9_repo:
        description: '酷9仓库 (如 9602894/080java)'
        required: false
        default: '9602894/080java'
      ku9_branch:
        description: '酷9分支'
        required: false
        default: 'main'
      tvbox_repo:
        description: 'TVBoxOS仓库 (如 tytestelle/TVBoxOS)'
        required: false
        default: 'tytestelle/TVBoxOS'
      tvbox_branch:
        description: 'TVBoxOS分支'
        required: false
        default: 'main'
      target_owner:
        description: '目标仓库所有者 (用户名或组织，留空则使用当前仓库所有者)'
        required: false
        default: ''   # 留空，作业中会自动填充
      target_repo:
        description: '目标仓库名称 (若不存在且提供了PAT，则会自动创建)'
        required: true
        default: 'ku9-recast'
      personal_access_token:
        description: '个人访问令牌 (若留空则使用GITHUB_TOKEN，但无法创建新仓库)'
        required: false
      branch:
        description: '目标分支 (默认 main)'
        required: false
        default: 'main'

jobs:
  recast_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出工作流脚本
        uses: actions/checkout@v4
        with:
          path: workflow

      - name: 检出酷9
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.ku9_repo }}
          ref: ${{ github.event.inputs.ku9_branch }}
          path: ku9

      - name: 检出TVBoxOS
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.tvbox_repo }}
          ref: ${{ github.event.inputs.tvbox_branch }}
          path: tvbox

      - name: 执行重铸脚本
        run: |
          chmod +x workflow/recast.sh
          workflow/recast.sh ./ku9 ./tvbox ./output 2>&1 | tee recast.log

      - name: 设置Git用户信息
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 准备推送
        env:
          GH_TOKEN: ${{ github.event.inputs.personal_access_token || secrets.GITHUB_TOKEN }}
          TARGET_OWNER: ${{ github.event.inputs.target_owner || github.repository_owner }}
          TARGET_REPO: ${{ github.event.inputs.target_repo }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          # 如果提供了 PAT，则尝试创建仓库（若不存在）
          if [ -n "${{ github.event.inputs.personal_access_token }}" ]; then
            echo "使用个人访问令牌，尝试创建仓库..."
            gh repo create "$TARGET_REPO" --private --clone --push --remote=origin 2>/dev/null || echo "仓库可能已存在，跳过创建"
          else
            echo "使用 GITHUB_TOKEN，跳过仓库创建（需要仓库已存在）"
          fi

          # 克隆目标仓库（或使用当前仓库）
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_OWNER}/${TARGET_REPO}.git" target_repo || { echo "克隆失败，请确保仓库存在或提供正确的PAT"; exit 1; }

          cd target_repo

          # 清空旧内容（保留 .git）
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} \;

          # 将 output 内容复制到仓库根目录
          cp -r ../output/. .

          # 添加 README（若不存在）
          if [ ! -f README.md ]; then
            cat > README.md << 'EOF'
          # 酷9 重铸版 (TVBoxOS骨架 + 酷9UI)

          本仓库由 GitHub Actions 自动生成。
          - Java 业务逻辑采用 TVBoxOS 标准实现
          - UI 资源 (res/assets) 保留酷9风格
          - 酷9混淆代码备份于 `ku9_obfuscated_java/`

          ## 编译
          ./gradlew :app:assembleJavaDebug
          EOF
          fi

          # 提交并推送
          git add -A
          git commit -m "重铸酷9: $(date +'%Y-%m-%d %H:%M')" || echo "没有新变更"
          git push -u origin "$BRANCH" --force

      - name: 上传日志（备查）
        uses: actions/upload-artifact@v4
        with:
          name: recast-logs
          path: |
            recast.log
            ./output/MERGE_REPORT.md 2>/dev/null || true
          retention-days: 7
