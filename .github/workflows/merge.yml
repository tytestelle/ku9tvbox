name: 重铸酷9并推送到新仓库

on:
  workflow_dispatch:
    inputs:
      ku9_repo:
        description: '酷9仓库 (如 9602894/080java)'
        required: false
        default: '9602894/080java'
      ku9_branch:
        description: '酷9分支'
        required: false
        default: 'main'
      tvbox_repo:
        description: 'TVBoxOS仓库 (如 tytestelle/TVBoxOS)'
        required: false
        default: 'tytestelle/TVBoxOS'
      tvbox_branch:
        description: 'TVBoxOS分支'
        required: false
        default: 'main'
      new_repo_name:
        description: '要创建的新仓库名称 (如 ku9-recast)'
        required: true
        default: 'ku9-recast'
      new_repo_visibility:
        description: '新仓库可见性'
        required: true
        default: 'private'
        type: choice
        options:
          - private
          - public

jobs:
  recast_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出工作流脚本
        uses: actions/checkout@v4
        with:
          path: workflow

      - name: 检出酷9
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.ku9_repo }}
          ref: ${{ github.event.inputs.ku9_branch }}
          path: ku9

      - name: 检出TVBoxOS
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.tvbox_repo }}
          ref: ${{ github.event.inputs.tvbox_branch }}
          path: tvbox

      - name: 执行重铸脚本
        run: |
          chmod +x workflow/recast.sh
          workflow/recast.sh ./ku9 ./tvbox ./output 2>&1 | tee recast.log

      - name: 设置Git用户信息
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 创建新仓库并推送
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}   # 需要你的个人访问令牌 (repo权限)
        run: |
          NEW_REPO="${{ github.event.inputs.new_repo_name }}"
          VISIBILITY="${{ github.event.inputs.new_repo_visibility }}"

          # 创建仓库（如果已存在则跳过，不会报错）
          gh repo create "$NEW_REPO" --"$VISIBILITY" --clone --push --remote=origin 2>/dev/null || echo "仓库可能已存在，继续克隆..."

          # 如果克隆失败，尝试直接 clone
          if [ ! -d "$NEW_REPO" ]; then
            git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/${NEW_REPO}.git" "$NEW_REPO"
          fi

          cd "$NEW_REPO"

          # 清空旧内容（但保留 .git）
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} \;

          # 将 output 内容复制到仓库根目录
          cp -r ../output/. .

          # 添加README（如果不存在）
          cat > README.md << 'EOF'
          # 酷9 重铸版 (基于 TVBoxOS 骨架 + 酷9 UI)

          本仓库由 GitHub Actions 自动生成，将酷9的UI资源与TVBoxOS的功能骨架合并而成。

          ## 编译
          ```bash
          ./gradlew :app:assembleJavaDebug
