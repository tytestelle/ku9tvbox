name: 重铸酷9并推送到目标仓库

on:
  workflow_dispatch:
    inputs:
      ku9_repo:
        description: '酷9仓库 (如 9602894/080java)'
        required: false
        default: '9602894/080java'
      ku9_branch:
        description: '酷9分支'
        required: false
        default: 'main'
      tvbox_repo:
        description: 'TVBoxOS仓库 (如 tytestelle/TVBoxOS)'
        required: false
        default: 'tytestelle/TVBoxOS'
      tvbox_branch:
        description: 'TVBoxOS分支'
        required: false
        default: 'main'
      target_owner:
        description: '目标仓库所有者 (用户名或组织，建议填写你的用户名)'
        required: false
        default: ''
      target_repo:
        description: '目标仓库名称 (若不存在且提供了有效PAT，会自动创建)'
        required: true
        default: 'ku9-recast'
      personal_access_token:
        description: '个人访问令牌 (需有repo和admin:repo_hook权限，留空则使用GITHUB_TOKEN但无法创建新仓库)'
        required: false
      branch:
        description: '目标分支 (默认 main)'
        required: false
        default: 'main'
      repo_visibility:
        description: '新仓库可见性 (仅当创建新仓库时生效)'
        required: false
        default: 'private'
        type: choice
        options:
          - private
          - public

jobs:
  recast_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出工作流脚本
        uses: actions/checkout@v4
        with:
          path: workflow

      - name: 检出酷9
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.ku9_repo }}
          ref: ${{ github.event.inputs.ku9_branch }}
          path: ku9

      - name: 检出TVBoxOS
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.tvbox_repo }}
          ref: ${{ github.event.inputs.tvbox_branch }}
          path: tvbox

      - name: 执行重铸脚本
        run: |
          chmod +x workflow/recast.sh
          workflow/recast.sh ./ku9 ./tvbox ./output 2>&1 | tee recast.log

      - name: 设置Git用户信息
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 创建或验证目标仓库
        env:
          GH_TOKEN: ${{ github.event.inputs.personal_access_token || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.event.inputs.target_owner || github.repository_owner }}
          REPO: ${{ github.event.inputs.target_repo }}
          VIS: ${{ github.event.inputs.repo_visibility }}
        run: |
          echo "目标仓库: ${OWNER}/${REPO}"
          # 检查仓库是否存在
          if gh repo view "${OWNER}/${REPO}" >/dev/null 2>&1; then
            echo "仓库已存在，无需创建"
          else
            if [ -n "${{ github.event.inputs.personal_access_token }}" ]; then
              echo "仓库不存在，使用PAT创建..."
              if ! gh repo create "${REPO}" --"${VIS}" ; then
                echo "❌ 创建仓库失败"
                exit 1
              fi
              # 验证创建结果
              if ! gh repo view "${OWNER}/${REPO}" >/dev/null 2>&1; then
                echo "❌ 创建后无法访问仓库，可能权限不足"
                exit 1
              fi
              echo "✅ 仓库创建成功"
            else
              echo "❌ 仓库不存在且未提供PAT，无法创建"
              exit 1
            fi
          fi

      - name: 推送代码到目标仓库
        env:
          GH_TOKEN: ${{ github.event.inputs.personal_access_token || secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.event.inputs.target_owner || github.repository_owner }}
          REPO: ${{ github.event.inputs.target_repo }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          # 克隆目标仓库
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${OWNER}/${REPO}.git" target_repo || {
            echo "❌ 克隆失败"
            exit 1
          }
          cd target_repo
          # 清空旧内容（保留 .git）
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} \;
          # 复制新内容
          cp -r ../output/. .
          # 添加 README
          if [ ! -f README.md ]; then
            cat > README.md << 'EOF'
          # 酷9 重铸版 (TVBoxOS骨架 + 酷9UI)

          本仓库由 GitHub Actions 自动生成。
          - Java 业务逻辑采用 TVBoxOS 标准实现
          - UI 资源 (res/assets) 保留酷9风格
          - 酷9混淆代码备份于 `ku9_obfuscated_java/`

          ## 编译
          ./gradlew :app:assembleJavaDebug
          EOF
          fi
          git add -A
          git commit -m "重铸酷9: $(date +'%Y-%m-%d %H:%M')" || echo "没有新变更"
          git push -u origin "$BRANCH" --force

      - name: 上传日志（备查）
        uses: actions/upload-artifact@v4
        with:
          name: recast-logs
          path: |
            recast.log
            ./output/MERGE_REPORT.md 2>/dev/null || true
          retention-days: 7
